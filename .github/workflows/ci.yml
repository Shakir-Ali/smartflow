name: SmartFlow CI Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install -DskipTests --batch-mode

      - name: Extract Version
        id: vars
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # 🐳 Enable Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🐳 Build Docker images (locally)
      - name: Build Auth Service Image
        run: docker build -t smartflow-auth-service ./auth-service

      - name: Build Order Service Image
        run: docker build -t smartflow-order-service ./order-service

      - name: Build Notification Service Image
        run: docker build -t smartflow-notification-service ./notification-service

      - name: Build Gateway Service Image
        run: docker build -t smartflow-gateway-service ./gateway-service